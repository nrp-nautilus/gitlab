apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: registry-redis
    app.kubernetes.io/name: redis
  name: registry-redis-headless
  namespace: gitlab
spec:
  ports:
    - name: tcp-redis
      port: 6379
      protocol: TCP
      targetPort: redis
  selector:
    app.kubernetes.io/instance: registry-redis
    app.kubernetes.io/name: redis
  sessionAffinity: None
  type: ClusterIP
