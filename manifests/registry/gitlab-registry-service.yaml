apiVersion: v1
kind: Service
metadata:
  annotations:
    service.kubernetes.io/topology-aware-hints: auto
  labels:
    app.kubernetes.io/name: gitlab-registry
  name: gitlab-registry
  namespace: gitlab
spec:
  ports:
    - name: metrics
      port: 5001
      protocol: TCP
      targetPort: 5001
    - name: http
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    name: gitlab-reg
  sessionAffinity: None
  type: ClusterIP
