apiVersion: v1
data:
  config.yml: |
    version: 0.1
    log:
      fields:
        service: registry
    storage:
      cache:
        blobdescriptor: inmemory
      # The driver is declared here, not through REGISTRY_STORAGE: that variable
      # replaces the whole storage map, maintenance included. The REGISTRY_STORAGE_S3_*
      # variables fill in the s3 parameters.
      s3: {}
      # Read-only window for the metadata database import (step two). The settings
      # under maintenance can only come from this file, not from the environment.
      maintenance:
        readonly:
          enabled: true
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
kind: ConfigMap
metadata:
  name: registry-config
  namespace: gitlab
