apiVersion: v1
data:
  config.yml: |
    version: 0.1
    log:
      fields:
        service: registry
    storage:
      cache:
        blobdescriptor: inmemory
      # The driver is declared here, not through REGISTRY_STORAGE: that variable
      # replaces the whole storage map, so anything else set here (the settings
      # under maintenance, for one) would be lost. The REGISTRY_STORAGE_S3_*
      # variables fill in the s3 parameters.
      s3: {}
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
kind: ConfigMap
metadata:
  name: registry-config
  namespace: gitlab
