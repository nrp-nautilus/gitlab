apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-state
  namespace: gitlab
  labels:
    app: gitlab
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: rook-ceph-block
