apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
    - name: pages
      port: 8090
      protocol: TCP
      targetPort: 8090
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
    - name: registry
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    name: gitlab
  sessionAffinity: None
  type: ClusterIP
