apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-admin
  namespace: gitlab
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - pods
      - pods/exec
      - pods/attach
    verbs:
      - create
      - update
      - get
      - delete
      - list
      - watch
