---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gitlab-ssh-host-keys
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  encryptedData:
    ssh_host_ecdsa_key: 
    ssh_host_ecdsa_key.pub: 
    ssh_host_ed25519_key: 
    ssh_host_ed25519_key.pub: 
    ssh_host_rsa_key: 
    ssh_host_rsa_key.pub: 
  template:
    metadata:
      labels:
        app: gitlab
      name: gitlab-ssh-host-keys
      namespace: gitlab
    type: Opaque
