---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gitlab-reg-secrets
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  encryptedData:
    REGISTRY_HTTP_SECRET: 
    REGISTRY_STORAGE_S3_ACCESSKEY: 
    REGISTRY_STORAGE_S3_SECRETKEY: 
  template:
    metadata:
      labels:
        app: gitlab-reg
      name: gitlab-reg-secrets
      namespace: gitlab
    type: Opaque
