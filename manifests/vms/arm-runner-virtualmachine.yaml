apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: arm-runner
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  running: false
  template:
    metadata:
      labels:
        kubevirt.io/domain: gitlab
        kubevirt.io/size: small
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: 4
        devices:
          disks:
            - bootOrder: 2
              cdrom:
                bus: sata
              name: cdromiso
            - bootOrder: 1
              disk:
                bus: virtio
              name: harddrive
            - cdrom:
                bus: sata
              name: virtiocontainerdisk
          inputs:
            - bus: usb
              name: tablet1
              type: tablet
          interfaces:
            - masquerade: {}
              name: default
        firmware:
          uuid: ed61d4b3-9124-5691-9a8e-a8c0bebf4498
        machine:
          type: q35
        resources:
          limits:
            memory: 10Gi
          requests:
            memory: 10Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: cdromiso
          persistentVolumeClaim:
            claimName: arm-runner
        - name: harddrive
          persistentVolumeClaim:
            claimName: arm-runner-hd
        - containerDisk:
            image: kubevirt/virtio-container-disk
          name: virtiocontainerdisk
