apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ai-gateway
  name: ai-gateway
  namespace: gitlab
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ai-gateway
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
      containers:
        - env:
            - name: AIGW_GITLAB_URL
              value: https://gitlab.nrp-nautilus.io
            - name: AIGW_GITLAB_API_URL
              value: https://gitlab.nrp-nautilus.io/api/v4/
            - name: AIGW_SELF_SIGNED_JWT__SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  key: aigw_signing.key
                  name: ai-gateway-jwt
            - name: AIGW_SELF_SIGNED_JWT__VALIDATION_KEY
              valueFrom:
                secretKeyRef:
                  key: aigw_validation.key
                  name: ai-gateway-jwt
            - name: DUO_WORKFLOW_AUTH__ENABLED
              value: "true"
            - name: DUO_WORKFLOW_SELF_SIGNED_JWT__SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  key: duo_workflow_jwt.key
                  name: ai-gateway-jwt
            - name: DUO_WORKFLOW_SELF_SIGNED_JWT__VALIDATION_KEY
              valueFrom:
                secretKeyRef:
                  key: duo_workflow_validation.key
                  name: ai-gateway-jwt
          image: registry.gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/model-gateway:self-hosted-v19.1.8-ee
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /monitoring/healthz
              port: 5052
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          name: ai-gateway
          ports:
            - containerPort: 5052
              name: http
              protocol: TCP
            - containerPort: 50052
              name: grpc
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /monitoring/healthz
              port: 5052
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
