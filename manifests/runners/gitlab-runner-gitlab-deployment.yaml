apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gitlab-runner-gitlab
  name: gitlab-runner-gitlab
  namespace: gitlab
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: gitlab-runner-gitlab
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gitlab-runner-gitlab
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: env
                    operator: In
                    values:
                      - system
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
      containers:
        - args:
            - run
          image: gitlab/gitlab-runner:v19.1.5
          imagePullPolicy: IfNotPresent
          name: runner
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/gitlab-runner
              name: config
      dnsPolicy: ClusterFirst
      initContainers:
        - args:
            - register
          env:
            - name: CI_SERVER_URL
              value: https://gitlab.com/
            - name: REGISTER_NON_INTERACTIVE
              value: "true"
            - name: CI_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: gitlab
                  name: gitlab-runner-token
            - name: RUNNER_EXECUTOR
              value: kubernetes
            - name: RUNNER_REQUEST_CONCURRENCY
              value: "4"
            - name: KUBERNETES_NAMESPACE
              value: gitlab
            - name: KUBERNETES_CPU_LIMIT
              value: "16"
            - name: KUBERNETES_MEMORY_LIMIT
              value: 15Gi
            - name: KUBERNETES_CPU_REQUEST
              value: "1"
            - name: KUBERNETES_MEMORY_REQUEST
              value: 10Gi
            - name: KUBERNETES_NODE_TOLERATIONS
              value: nautilus.io/noceph=true:NoSchedule
            - name: KUBERNETES_PULL_POLICY
              value: always
            - name: REGISTER_LOCKED
              value: "true"
            - name: KUBERNETES_NODE_SELECTOR
              value: gitlab-worker:true
            - name: OUTPUT_LIMIT
              value: "32768"
            - name: CACHE_TYPE
              value: s3
            - name: CACHE_SHARED
              value: "true"
            - name: CACHE_S3_SERVER_ADDRESS
              value: s3-west.nrp-nautilus.io
            - name: CACHE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: accesskey
                  name: runner-cache
            - name: CACHE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secretkey
                  name: runner-cache
            - name: CACHE_S3_BUCKET_NAME
              value: runners-cache
            - name: CACHE_S3_INSECURE
              value: "false"
          image: gitlab/gitlab-runner:v19.1.5
          imagePullPolicy: IfNotPresent
          name: init-runner
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/gitlab-runner
              name: config
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: runner
      serviceAccountName: runner
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: nautilus.io/system
          operator: Exists
      volumes:
        - emptyDir: {}
          name: config
