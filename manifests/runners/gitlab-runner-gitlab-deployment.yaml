# Runs CI jobs for a gitlab.com runner (authentication token in gitlab-runner-token, key gitlab; tags and scope are set on gitlab.com).
# Its jobs run in Kata VMs in gitlab-ci-kata (see gitlab-runner-kata-external-
# configmap.yaml), not in the gitlab namespace. The cache has its own S3 prefix,
# so these jobs can't read or overwrite NRP projects' caches when project IDs
# collide across GitLab servers.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gitlab-runner-gitlab
  name: gitlab-runner-gitlab
  namespace: gitlab
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gitlab-runner-gitlab
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitlab-runner-gitlab
      annotations:
        # The template is read only at pod start; bump this with every change
        # to its key in gitlab-runner-kata-external-config.
        nrp-nautilus.io/runner-config-revision: "1"
    spec:
      serviceAccountName: gitlab-runner-kata-external
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: env
                    operator: In
                    values:
                      - system
      tolerations:
        - effect: NoSchedule
          key: nautilus.io/ceph
          operator: Exists
        - effect: NoSchedule
          key: nautilus.io/system
          operator: Exists
      initContainers:
        - name: register
          image: gitlab/gitlab-runner:v19.1.5
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              gitlab-runner register --non-interactive --template-config /template/gitlab-com.template.toml
              sed -i 's/^concurrent = .*/concurrent = 2/' /etc/gitlab-runner/config.toml
          env:
            - name: CI_SERVER_URL
              value: https://gitlab.com/
            - name: CI_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-runner-token
                  key: gitlab
            - name: RUNNER_EXECUTOR
              value: kubernetes
            - name: CACHE_TYPE
              value: s3
            - name: CACHE_PATH
              value: external/gitlab.com
            - name: CACHE_SHARED
              value: "true"
            - name: CACHE_S3_SERVER_ADDRESS
              value: s3-west.nrp-nautilus.io
            - name: CACHE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: accesskey
                  name: runner-cache
            - name: CACHE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secretkey
                  name: runner-cache
            - name: CACHE_S3_BUCKET_NAME
              value: runners-cache
            - name: CACHE_S3_INSECURE
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /etc/gitlab-runner
              name: config
            - mountPath: /template
              name: template
              readOnly: true
      containers:
        - name: runner
          image: gitlab/gitlab-runner:v19.1.5
          imagePullPolicy: IfNotPresent
          args:
            - run
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - mountPath: /etc/gitlab-runner
              name: config
      volumes:
        - name: config
          emptyDir: {}
        - name: template
          configMap:
            name: gitlab-runner-kata-external-config
