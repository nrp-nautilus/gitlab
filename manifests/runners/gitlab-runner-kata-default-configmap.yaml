# Template passed to `gitlab-runner register --template-config`.
# The instance's default runner: it takes untagged jobs (and jobs tagged
# `kata-default`). Like gitlab-runner-kata, each job is one pod in
# gitlab-ci-kata on the kata runtime, so it gets its own VM, but nothing here is
# privileged and there is no dind service. Docker builds belong on the `docker`
# tag.
#
# Sizes come from the old gitlab-runner-general jobs (14 days to 2026-11-07,
# 2,336 jobs): 99% peaked under 2.5 cores, 95% under 2.7 GiB RSS and 99% under
# 16 GiB. Jobs that need more set KUBERNETES_CPU_LIMIT, KUBERNETES_MEMORY_LIMIT
# and KUBERNETES_MEMORY_REQUEST, up to the *_overwrite_max_allowed caps.
#
# The memory cap is 50Gi, which is what gitlab-runner-general gave every job.
# Image builds need more than the old cap of 24Gi: nrp/coder-images' kaniko
# build of vivado-vitis passed under the old runner's 50Gi limit (job 191297),
# and here the node OOM-kills its Kata VM at 8Gi (job 193200) and at 24Gi (job
# 193228). Its esnet and pytorch builds die the same way (jobs 193225,
# 193226). With helper and one service at their caps a pod stays under 16
# cores, and under 32 GB as long as the job's memory limit is 24Gi or less.
# 16 cores and 32 GB are the nautilus-admission limits for bare pods, so a job
# that asks for more memory than that depends on the namespace's
# pod_runtime_exceptions entry; jobs at the defaults do not.
#
# Ephemeral storage has no default here. The namespace's LimitRange
# `ephemeral-storage-default-limit` (live, not in this repo) gives every container a
# limit of 50Gi and a request of 0, so the scheduler does not count the disk a job
# uses. Image builds need more: yge/container's DeepBE build was evicted at the 50Gi
# limit (job 194328), and its tf-gpu builds hold 36 GiB before their own payload.
# Jobs set KUBERNETES_EPHEMERAL_STORAGE_REQUEST and
# KUBERNETES_EPHEMERAL_STORAGE_LIMIT, up to 1Ti. A job that sets both to what it
# needs is placed on a node with that much allocatable disk, and the LimitRange has
# no maximum of its own. The Kata nodes' disks are about 0.9 TB (c4705, c4719) and
# 7 TB (c6034): an ask above a node's disk is schedulable only where it fits, so a
# job should ask for what it uses, not for the cap.
#
# Under Kata the VM gets 1 vCPU and 2 GiB plus the containers' limits, so nproc
# inside a job is about cpu_limit + 2, not the node's core count.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner-kata-default-config
  namespace: gitlab
data:
  config.template.toml: |
    [[runners]]
      name = "gitlab-runner-kata-default"
      limit = 10
      output_limit = 32768
      # Tools that check whether they run in a container look for an overlay
      # root filesystem; under Kata the root is virtio-fs, so they find none.
      # Kaniko then refuses to build ("kaniko should only be run inside of a
      # container"). `container` is systemd's marker variable, and Kaniko accepts
      # it. Jobs can override it.
      environment = ["container=kube"]
      [runners.kubernetes]
        namespace = "gitlab-ci-kata"
        runtime_class_name = "kata"
        privileged = false
        service_account = "ci-job"
        # Only used by jobs that don't set `image:`.
        image = "alpine:3.22"
        # Not if-not-present: a node's image cache is shared by every job on
        # it, so a job could start another project's private image that is
        # already on the node without having the credentials to pull it.
        # Jobs can't pick a different policy. The kubelet's check is a
        # manifest HEAD, which Docker Hub doesn't count against pull limits.
        pull_policy = ["always"]
        allowed_pull_policies = ["always"]
        poll_timeout = 600
        cpu_request = "1"
        cpu_limit = "4"
        cpu_request_overwrite_max_allowed = "2"
        cpu_limit_overwrite_max_allowed = "12"
        memory_request = "8Gi"
        memory_limit = "8Gi"
        memory_request_overwrite_max_allowed = "50Gi"
        memory_limit_overwrite_max_allowed = "50Gi"
        ephemeral_storage_request_overwrite_max_allowed = "1Ti"
        ephemeral_storage_limit_overwrite_max_allowed = "1Ti"
        helper_cpu_request = "100m"
        helper_cpu_limit = "1"
        helper_memory_request = "256Mi"
        helper_memory_limit = "1Gi"
        # No job on the old default runners used `services:` in the 14 days
        # measured; these cover a small database or cache for tests.
        service_cpu_request = "100m"
        service_cpu_limit = "1"
        service_cpu_limit_overwrite_max_allowed = "2"
        service_memory_request = "1Gi"
        service_memory_limit = "1Gi"
        service_memory_request_overwrite_max_allowed = "4Gi"
        service_memory_limit_overwrite_max_allowed = "4Gi"
        [runners.kubernetes.node_selector]
          "kubernetes.io/arch" = "amd64"
        [runners.kubernetes.node_tolerations]
          "nautilus.io/testing=kata" = "NoSchedule"
        [runners.kubernetes.pod_labels]
          "app.kubernetes.io/part-of" = "gitlab-runner-kata-default"
