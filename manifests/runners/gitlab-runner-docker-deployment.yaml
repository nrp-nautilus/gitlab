apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gitlab-runner-docker
  name: gitlab-runner-docker
  namespace: gitlab
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: gitlab-runner-docker
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gitlab-runner-docker
    spec:
      containers:
        - args:
            - run
          image: gitlab/gitlab-runner:v19.1.5
          imagePullPolicy: Always
          name: runner
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/gitlab-runner
              name: config
      dnsPolicy: ClusterFirst
      initContainers:
        - args:
            - register
          env:
            - name: CI_SERVER_URL
              value: https://gitlab.nrp-nautilus.io/
            - name: REGISTER_NON_INTERACTIVE
              value: "true"
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  key: general
                  name: gitlab-runner-token
            - name: RUNNER_EXECUTOR
              value: kubernetes
            - name: RUNNER_TAG_LIST
              value: sysbox
            - name: RUNNER_REQUEST_CONCURRENCY
              value: "4"
            - name: RUNNER_PULL_POLICY
              value: Always
            - name: KUBERNETES_NAMESPACE
              value: gitlab
            - name: REGISTER_LOCKED
              value: "false"
            - name: KUBERNETES_CPU_LIMIT
              value: "16"
            - name: KUBERNETES_MEMORY_LIMIT
              value: 50Gi
            - name: KUBERNETES_CPU_REQUEST
              value: "1"
            - name: KUBERNETES_MEMORY_REQUEST
              value: 50Gi
            - name: KUBERNETES_EPHEMERAL_STORAGE_LIMIT
              value: 200Gi
            - name: KUBERNETES_EPHEMERAL_STORAGE_REQUEST
              value: 200Gi
            - name: KUBERNETES_NODE_SELECTOR
              value: sysbox-runtime:running
            - name: KUBERNETES_RUNTIME_CLASS_NAME
              value: sysbox-runc
            - name: KUBERNETES_PULL_POLICY
              value: always
            - name: RUNNER_OUTPUT_LIMIT
              value: "32768"
            - name: CACHE_TYPE
              value: s3
            - name: CACHE_SHARED
              value: "true"
            - name: CACHE_S3_SERVER_ADDRESS
              value: s3-west.nrp-nautilus.io
            - name: CACHE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: accesskey
                  name: runner-cache
            - name: CACHE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secretkey
                  name: runner-cache
            - name: CACHE_S3_BUCKET_NAME
              value: runners-cache
            - name: CACHE_S3_INSECURE
              value: "false"
          image: gitlab/gitlab-runner:v19.1.5
          imagePullPolicy: Always
          name: init-runner
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/gitlab-runner
              name: config
        - args:
            - |
              cat <<EOF >> /etc/gitlab-runner/config.toml
                  privileged = true
                [runners.kubernetes.pod_annotations]
                "io.kubernetes.cri-o.userns-mode"="auto:size=65536"
                [[runners.kubernetes.volumes.empty_dir]]
                name = "docker-certs"
                mount_path = "/certs/client"
                medium = "Memory"
              EOF
          command:
            - sh
            - -c
          image: alpine
          imagePullPolicy: Always
          name: init-runner-volume
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/gitlab-runner
              name: config
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: runner
      serviceAccountName: runner
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: config
