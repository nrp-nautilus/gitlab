# Template passed to `gitlab-runner register --template-config`.
# Each job is one pod in gitlab-ci-kata on the kata runtime, so it gets its own
# VM. The runner adds a docker:dind service to every job and points DOCKER_HOST
# at it, so `docker build` jobs written for the old docker.sock runners keep
# working unchanged. The service runs privileged, but only inside the job's VM.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner-kata-config
  namespace: gitlab
data:
  config.template.toml: |
    [[runners]]
      name = "gitlab-runner-kata"
      limit = 3
      output_limit = 32768
      # container=kube: Kaniko looks for an overlay root to decide it's in a
      # container; under Kata the root is virtio-fs, so it refuses to build
      # without this marker. See gitlab-runner-kata-default-configmap.yaml.
      environment = [
        "DOCKER_HOST=tcp://docker:2375",
        "DOCKER_TLS_CERTDIR=",
        "container=kube",
      ]
      [runners.kubernetes]
        namespace = "gitlab-ci-kata"
        runtime_class_name = "kata"
        privileged = true
        service_account = "ci-job"
        image = "docker:28-cli"
        pull_policy = ["if-not-present"]
        poll_timeout = 600
        cpu_request = "1"
        cpu_limit = "4"
        memory_request = "4Gi"
        memory_limit = "4Gi"
        service_cpu_request = "2"
        service_cpu_limit = "8"
        # dind keeps images in guest RAM (see the docker-data volume below), and
        # Kata gives that tmpfs about half the VM's memory, so 48Gi buys ~24G of
        # image storage. Large CUDA image builds need that much.
        service_memory_request = "48Gi"
        service_memory_limit = "48Gi"
        helper_cpu_request = "100m"
        helper_cpu_limit = "1"
        helper_memory_request = "256Mi"
        helper_memory_limit = "1Gi"
        [runners.kubernetes.node_selector]
          "kubernetes.io/arch" = "amd64"
        [runners.kubernetes.node_tolerations]
          "nautilus.io/testing=kata" = "NoSchedule"
        [runners.kubernetes.pod_labels]
          "app.kubernetes.io/part-of" = "gitlab-runner-kata"
        # Under Kata the container filesystem is virtio-fs from the node. dockerd
        # can't run overlay2 there, so it falls back to vfs, and image layers that
        # carry overlay xattrs fail to unpack ("lsetxattr ... operation not
        # supported"). A memory-backed emptyDir is tmpfs inside the guest, where
        # overlay2 works. Kata ignores size_limit and sizes the tmpfs at about half
        # the VM's memory.
        [[runners.kubernetes.volumes.empty_dir]]
          name = "docker-data"
          mount_path = "/var/lib/docker"
          medium = "Memory"
        [[runners.kubernetes.services]]
          name = "docker:28-dind"
          alias = "docker"
          # With DOCKER_TLS_CERTDIR empty, the dind entrypoint starts dockerd on
          # tcp://0.0.0.0:2375 without --tls=false, and dockerd then sleeps 16s
          # ("Startup is intentionally being slowed down") before it opens that
          # listener. --tls=false states the intent and skips the 15s part. Port
          # 2375 isn't reachable from outside the pod: gitlab-ci-kata denies all
          # ingress.
          command = ["--tls=false"]
          # The runner doesn't wait for services unless they set
          # HEALTHCHECK_TCP_PORT. With it, the helper container dials
          # localhost:2375 until dockerd answers, and only then does the job
          # script start. Without it, scripts that call docker in their first
          # seconds fail with "Cannot connect to the Docker daemon".
          environment = ["HEALTHCHECK_TCP_PORT=2375"]
