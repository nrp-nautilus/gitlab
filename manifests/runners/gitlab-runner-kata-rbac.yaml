# gitlab-runner-kata's own identity. It may manage job pods in gitlab-ci-kata
# and nothing in the gitlab namespace, unlike the shared `runner` service
# account, which can read every Secret there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-kata
  namespace: gitlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner-kata
  namespace: gitlab-ci-kata
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/attach", "pods/exec"]
    verbs: ["create", "delete", "get", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "delete", "get", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-kata
  namespace: gitlab-ci-kata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner-kata
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-kata
    namespace: gitlab
