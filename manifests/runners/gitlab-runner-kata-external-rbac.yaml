# Identity of gitlab-runner-gitlab and gitlab-runner-sdsc, which run jobs from
# other GitLab servers. Same Role in gitlab-ci-kata as the Kata runners
# (gitlab-runner-kata-rbac.yaml); nothing in the gitlab namespace. They used
# the shared `runner` account, which can read every Secret there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-kata-external
  namespace: gitlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-kata-external
  namespace: gitlab-ci-kata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner-kata
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-kata-external
    namespace: gitlab
