# Caps gitlab-runner-kata at 3 concurrent jobs (about 53Gi each). Kata runs on only three
# amd64 nodes (28 cores each), which are shared with other Kata tests.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-jobs
  namespace: gitlab-ci-kata
spec:
  hard:
    pods: "6"
    requests.cpu: "24"
    requests.memory: 160Gi
    limits.cpu: "64"
    limits.memory: 160Gi
